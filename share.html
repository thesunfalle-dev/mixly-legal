<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#29282b" />
    <meta name="color-scheme" content="dark" />
    <title>Open Mixly</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #29282b;
        --surface: #343436;
        --text: #ffffff;
        --muted: #a5a5a5;
        --accent: #ebff57;
        --border: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--background);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before,
      body::after {
        position: fixed;
        z-index: -1;
        width: 90vmax;
        height: 58vmax;
        content: "";
        filter: blur(80px);
        opacity: 0.55;
        transform: rotate(-24deg);
      }

      body::before {
        top: -30vmax;
        right: -42vmax;
        background: linear-gradient(135deg, transparent 28%, rgba(235, 255, 87, 0.78) 72%);
      }

      body::after {
        bottom: -35vmax;
        left: -45vmax;
        background: linear-gradient(135deg, rgba(184, 115, 173, 0.58), transparent 70%);
      }

      main {
        width: min(420px, calc(100% - 40px));
        padding: 32px 28px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(52, 52, 54, 0.92);
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.3);
        text-align: left;
      }

      h1 {
        margin: 0;
        color: var(--accent);
        font-size: 54px;
        font-weight: 900;
        line-height: 0.9;
      }

      p {
        margin: 22px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.5;
      }

      a {
        display: block;
        margin-top: 24px;
        padding: 16px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #1d1d1f;
        font-weight: 750;
        text-align: center;
        text-decoration: none;
      }

      .store-link {
        margin-top: 12px;
        padding: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mixly</h1>
      <p id="status">Opening this mix in the Mixly app...</p>
      <a id="open-button" href="#">Open in Mixly</a>
      <a class="store-link" id="store-button" href="#">Get Mixly from the App Store</a>
    </main>
    <script>
      (() => {
        const IOS_STORE_URL = "https://apps.apple.com/app/id6762792005";
        const ANDROID_STORE_URL =
          "https://play.google.com/store/apps/details?id=com.vladyarmakovich.mixly";
        const ANDROID_PACKAGE = "com.vladyarmakovich.mixly";
        const params = new URLSearchParams(window.location.search);
        const mixId = (params.get("mix") || params.get("mixId") || "").trim();
        const labPayload = (params.get("lab") || "").trim();
        const isPreview = params.get("preview") === "1";
        const encodedMixId = encodeURIComponent(mixId);
        const userAgent = navigator.userAgent || "";
        const isAndroid = /android/i.test(userAgent);
        const isIOS =
          /iphone|ipad|ipod/i.test(userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const deepLink = labPayload
          ? `mixly://lab?data=${encodeURIComponent(labPayload)}`
          : mixId
            ? `mixly://mix/${encodedMixId}`
            : "mixly://";
        const storeUrl = isAndroid ? ANDROID_STORE_URL : IOS_STORE_URL;
        const androidIntentPath = labPayload
          ? `lab?data=${encodeURIComponent(labPayload)}`
          : mixId
            ? `mix/${encodedMixId}`
            : "";
        const androidIntent = androidIntentPath
          ? `intent://${androidIntentPath}#Intent;scheme=mixly;package=${ANDROID_PACKAGE};S.browser_fallback_url=${encodeURIComponent(
              ANDROID_STORE_URL
            )};end`
          : ANDROID_STORE_URL;
        const openUrl = isAndroid ? androidIntent : isIOS ? deepLink : storeUrl;
        const button = document.getElementById("open-button");
        const storeButton = document.getElementById("store-button");
        const status = document.getElementById("status");

        const openMixly = () => {
          window.location.href = openUrl;
        };

        button.href = openUrl;
        storeButton.href = storeUrl;
        storeButton.textContent = isAndroid
          ? "Get Mixly from Google Play"
          : "Get Mixly from the App Store";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          openMixly();
        });

        if (!mixId) status.textContent = "Opening the Mixly app...";
        if (labPayload) status.textContent = "Importing this mix into Mixly Labs...";
        if (!isPreview) window.setTimeout(openMixly, 120);
      })();
    </script>
  </body>
</html>
